<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Shiori">
<title>Shiori</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="ph">

<section class="screen on has-tabs root" id="library">
 <div class="hd"><h1 class="t28">Library</h1><span class="sp"></span><button class="sq" data-go="search" aria-label="Search" data-i="search"></button><button class="sq" id="addBtn" aria-label="Add books" data-i="plus"></button></div>
 <div class="body"><div id="libTop"><button class="dd" id="showBtn"><span id="showLbl">All books</span><span data-i="down" data-s="14"></span></button></div><div class="grid" id="grid"></div><div id="libEmpty"></div></div>
 
</section>

<section class="screen" id="book">
 <div class="hd"><button class="sq" data-back data-i="back" aria-label="Back"></button><span class="sp"></span><button class="sq" id="bookMore" data-i="more" aria-label="More"></button></div>
 <div class="body" id="bookBody"></div>
</section>

<section class="screen" id="reader">
 <div class="rhd"><button class="sq" data-back data-i="back" aria-label="Back"></button><div class="lab" id="rLab"></div><button class="sq" id="aaBtn" data-i="type" aria-label="Reading settings"></button><button class="sq" id="bmBtn" data-i="bookmark" aria-label="Bookmark this page"></button></div>
 <div class="rscroll" id="rscroll"><div class="paper" id="paper"><svg class="ribbon" id="ribbon" viewBox="0 0 14 64" aria-hidden="true"><path d="M0 0h14v62l-7-6-7 6z" fill="#111"/></svg><div class="bt" id="bt"></div></div></div>
 <div class="pmode" id="pmode"></div>
 <div class="mini" id="mini"><button id="miniPlay" aria-label="Play or pause"></button><div style="flex:1;min-width:0"><div class="mtitle" id="miniTitle"></div><div class="pb" id="miniPb" style="margin-top:6px"></div></div><button id="miniX" aria-label="Stop"></button></div>
 <div class="rbot"><div class="pb" id="rpb"></div><div class="rmeta mono"><span id="rPage"></span><span class="muted" id="rLeft"></span></div>
 <div class="tools"><button class="tool" id="tContents"><span data-i="list"></span>Contents</button><button class="tool" id="tListen"><span data-i="head"></span>Listen</button><button class="tool" id="tSearch"><span data-i="search"></span>Find</button><button class="tool" id="tNotes"><span data-i="pen"></span>Notebook</button></div></div>
</section>

<section class="screen" id="notebook"><div class="hd"><button class="sq" data-back data-i="back" aria-label="Back"></button><div class="ttlbox"><h2 class="t24">Notebook</h2><div class="sub" id="nbSub"></div></div><span class="sp"></span><button class="sq" id="nbShare" data-i="share" aria-label="Export notes"></button></div><div class="body" id="nbBody"></div></section>

<section class="screen" id="search"><div class="hd"><button class="sq" data-back data-i="back" aria-label="Back"></button><div class="sbox"><span data-i="search" data-s="16"></span><input id="sIn" type="search" enterkeyhint="search" autocomplete="off" placeholder="Search books, notes, pages…"></div></div><div class="body" id="sBody"></div></section>

<section class="screen" id="making"><div class="hd"><button class="sq" id="mkClose" data-i="close" aria-label="Close"></button></div><div class="body mk">
 <div id="mkBook" class="mkbook"></div>
 <h2 class="t24" style="margin-top:24px" id="mkTitle">Making your book</h2><div class="muted small" id="mkSub"></div>
 <div class="pb" id="mkPb" style="margin-top:24px"></div>
 <div class="steps" id="mkSteps"></div>
 <button class="btn" id="mkGo" disabled style="margin-top:24px"></button>
 <div class="muted small" id="mkNote" style="margin-top:12px;text-align:center"></div></div></section>

<section class="screen has-tabs root" id="knowledge"><div class="hd"><h1 class="t28">Knowledge</h1><span class="sp"></span><button class="sq" id="kShare" data-i="share" aria-label="Export"></button></div><div class="body" id="kBody"></div></section>

<section class="screen has-tabs root" id="journal"><div class="hd"><h1 class="t28">Journal</h1><span class="sp"></span><button class="sq" data-go="settings" data-i="gear" aria-label="Settings"></button></div><div class="body" id="jBody"></div></section>

<section class="screen" id="settings"><div class="hd"><button class="sq" data-back data-i="back" aria-label="Back"></button><h2 class="t24">Settings</h2></div><div class="body" id="setBody"></div></section>

<nav class="tabs" id="tabbar"><i class="tabpill" id="tabpill"></i></nav>
<div class="dim" id="dim"></div>
<div class="sheet" id="sheet" role="dialog"><div class="handle" id="handle"></div><div class="sc" id="sheetBody"></div></div>
<div class="qbar" id="qbar"></div>
<div class="toast" id="toast" role="status"></div>
<div class="dialog" id="dialog" role="alertdialog"></div>
<input type="file" id="fileIn" accept="application/pdf,.pdf" multiple hidden>
<input type="file" id="backupIn" accept="application/json,.json" hidden>
<div class="splash" id="splash"><div class="sbw" id="sbw"><div class="sb" id="sb"><div class="sb-page"></div><div class="sb-lf"></div><div class="sb-lf"></div><div class="sb-lf"></div><div class="sb-lf"></div><div class="sb-cv" id="sbCv"><div class="f"><div id="sbIcon" class="sbicon"></div></div><div class="b"></div></div><div class="sb-rib" id="sbRib"></div></div></div><div class="wm" id="wm"></div><div class="mono muted wmsub" id="wmSub">栞 · your reading library</div></div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
